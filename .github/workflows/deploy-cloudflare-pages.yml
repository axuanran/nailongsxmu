name: Deploy · Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 没配 secrets 时不红叉，只留一条 notice，方便先推代码后配密钥
      - name: 检查 Cloudflare Secrets
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过部署::还没配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，按 README「自动部署」一节配好再 push。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 只把站点文件放进 .deploy，避免把 .git / .github / README 一起传上去
      - name: 准备静态目录
        run: |
          mkdir -p .deploy
          rsync -a --exclude '.git' --exclude '.github' --exclude '.deploy' \
                --exclude 'node_modules' --exclude 'README.md' --exclude '.gitignore' \
                ./ .deploy/
          echo "待部署文件："
          find .deploy -type f | sort

      - name: 部署
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .deploy --project-name=sxmu-nailong --branch=main
